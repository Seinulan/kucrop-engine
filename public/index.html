<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUCrop</title>
    <meta name="description" content="KUCrop: веб-версия AquaCrop для Северо-Казахстанской области с ИИ-суррогатом">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script>
        // тема до отрисовки, чтобы не было вспышки светлой страницы
        (function () {
            var pref = 'system';
            try { pref = localStorage.getItem('kucrop.theme') || 'system'; } catch (e) {}
            var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
</head>
<body>
    <div class="app" id="app">
        <aside class="side" id="side" aria-label="KUCrop">
            <a class="brand" href="#/overview">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none" stroke-linecap="round">
                        <path d="M16 29V9" stroke="#f4cf7a" stroke-width="2"/>
                        <g fill="#f4cf7a">
                            <ellipse cx="12.4" cy="12.5" rx="2.4" ry="4" transform="rotate(-28 12.4 12.5)"/>
                            <ellipse cx="19.6" cy="12.5" rx="2.4" ry="4" transform="rotate(28 19.6 12.5)"/>
                            <ellipse cx="12.4" cy="18.5" rx="2.4" ry="4" transform="rotate(-28 12.4 18.5)"/>
                            <ellipse cx="19.6" cy="18.5" rx="2.4" ry="4" transform="rotate(28 19.6 18.5)"/>
                            <ellipse cx="16" cy="6.5" rx="2.2" ry="3.6"/>
                        </g>
                        <path d="M5 26c4-2 7-2 11 0s7 2 11 0" stroke="#7fc79a" stroke-width="2"/>
                    </svg>
                </span>
                <span><b>KUCrop</b><span data-t="app.tagline"></span></span>
            </a>
            <nav class="nav" id="nav"></nav>
            <div class="side-spacer"></div>
            <div class="limits">
                <h4><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span data-t="limits.title"></span></h4>
                <p data-t="limits.text"></p>
                <a href="#/model" data-t="limits.more"></a>
            </div>
            <div class="who">
                <span class="avatar" data-t="guest.initial"></span>
                <div><b data-t="guest.name"></b><span data-t="guest.sub"></span></div>
            </div>
        </aside>
        <div class="scrim" id="scrim"></div>

        <div class="main">
            <header class="top">
                <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-controls="side" aria-expanded="false">
                    <svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="sr-only" data-t="nav.menu"></span>
                </button>
                <div class="top-title">
                    <h2 id="pageTitle"></h2>
                    <p id="pageSub"></p>
                </div>
                <span class="pill" id="statusPill" role="status"><span class="dot"></span><span id="statusText"></span></span>
                <div class="seg" id="langSeg" role="group"></div>
                <button class="icon-btn theme-btn" id="themeBtn" type="button"></button>
                <span class="avatar" data-t="guest.initial" aria-hidden="true"></span>
            </header>
            <main class="content" id="content"></main>
        </div>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
